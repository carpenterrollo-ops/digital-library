<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
</head>
<body>

<form action="/add_book" method="POST">
    <label for="title">Titel:</label>
    <input type="text" id="title" name="title" required><br><br>
    <label for="publication_year">Erscheinungsjahr:</label>
    <input type="text" id="publication_year" name="publication_year" required><br><br>
    <label for="isbn">ISBN:</label>
    <input type="text" id="isbn" name="isbn" required><br><br>

    <label for="author_id">Autor auswählen:</label>
    <select id="author_id" name="author_id" required>
      {% for author in authors %}
        <option value="{{ author.author_id }}">{{ author.name }}</option>
      {% endfor %}
    </select><br><br>

    <input type="submit" value="Add Book">
</form>

    {% if success_message %}
        <p style="color: green; font-weight: bold;">{{ success_message }}</p>
    {% endif %}

</body>
</html>
